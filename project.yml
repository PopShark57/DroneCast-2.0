# DroneCast — XcodeGen project spec
#
# Convenience path:  brew install xcodegen && xcodegen generate
# (The README also documents a manual Xcode setup that needs no tooling.)
#
# Before first build:
#   1. Set DEVELOPMENT_TEAM below (or pick your team in Xcode → Signing —
#      a free "(Personal Team)" works).
#   2. Rename the App Group in BOTH .entitlements files AND in
#      DroneCastWatch/Persistence/SharedDefaults.swift to a group you own.
#
# Weather data comes from Open-Meteo by default — no WeatherKit entitlement,
# so free personal teams can sign. See README "Upgrading to WeatherKit".
#
# AI Briefing: the watch asks Claude (Anthropic API key in
# Config/Secrets.xcconfig, git-ignored), then the DroneCastPhone companion's
# on-device Apple Intelligence model, then falls back to the template.
# Private Cloud Compute stays off (paid-program entitlement). See README
# "AI Briefing".

name: DroneCast

options:
  bundleIdPrefix: com.sguzyayev
  deploymentTarget:
    watchOS: "27.0"
    iOS: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "7RLDYXQTNX"   # your (Personal Team)
    CODE_SIGN_STYLE: Automatic

targets:

  # iPhone companion: lends the watch its on-device Apple Intelligence
  # model over WatchConnectivity, and carries the watch app on install.
  DroneCastPhone:
    type: application
    platform: iOS
    sources:
      - path: DroneCastPhone
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sguzyayev.dronecast
        INFOPLIST_FILE: DroneCastPhone/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: DroneCastWatch
    scheme: {}

  DroneCastWatch:
    type: application
    platform: watchOS
    sources:
      - path: DroneCastWatch
      - path: Shared
    configFiles:
      Debug: Config/DroneCastWatch.xcconfig
      Release: Config/DroneCastWatch.xcconfig
    settings:
      base:
        # A companion's watch app ID must start with the iPhone app's.
        PRODUCT_BUNDLE_IDENTIFIER: com.sguzyayev.dronecast.watchkitapp
        COMPANION_BUNDLE_IDENTIFIER: com.sguzyayev.dronecast
        INFOPLIST_FILE: DroneCastWatch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: DroneCastWatch/DroneCastWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
    dependencies:
      - target: DroneCastWidgets
    scheme:
      testTargets:
        - DroneCastTests

  DroneCastWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: DroneCastWidgets
      # Domain + Persistence + Briefing are shared with the app target by
      # direct source membership (no framework needed at this size). The
      # widget reads cached briefings only; it never calls a model.
      - path: DroneCastWatch/Domain
      - path: DroneCastWatch/Persistence
      - path: DroneCastWatch/Briefing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sguzyayev.dronecast.watchkitapp.widgets
        INFOPLIST_FILE: DroneCastWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: DroneCastWidgets/DroneCastWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "4"

  DroneCastTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: Tests
      # The scorer and the briefing layer are pure Foundation — compile them
      # straight into the test bundle so tests run standalone, with no host
      # app and no language model required.
      - path: DroneCastWatch/Domain
      - path: DroneCastWatch/Persistence
      - path: DroneCastWatch/Briefing
      # Claude request/response handling is plain Foundation too.
      - path: DroneCastWatch/Services/ClaudeBriefingGenerator.swift
      - path: Shared/BriefingPrompt.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sguzyayev.dronecast.tests
